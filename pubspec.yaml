name: flutter_absensi_app
description: "Aplikasi presensi karyawan: WFO/WFH/WFA, izin & cuti, lembur, dan verifikasi wajah."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# versionName + versionCode untuk rilis Play Store / App Store.
# Naikkan build number (angka setelah '+') pada setiap unggahan baru —
# Play Console menolak versionCode yang sama atau lebih rendah.
version: 1.4.0+5

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State management & functional ---
  flutter_bloc: ^9.1.0
  bloc: ^9.0.1
  freezed_annotation: ^3.0.0
  dartz: ^0.10.1

  # --- Jaringan ---
  http: ^1.6.0
  http_parser: ^4.1.2

  # --- Penyimpanan lokal ---
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  path: ^1.9.0

  # --- Lokasi & peta ---
  # flutter_map + OpenStreetMap dipakai menggantikan google_maps_flutter:
  # berjalan di Android, iOS, dan web tanpa API key, dan tile-nya bisa
  # dikonfigurasi dari `/api/app-settings` (`map.tile_url`).
  geolocator: ^14.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # --- Kamera, wajah, & berkas ---
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.14.0
  google_mlkit_commons: ^0.12.0
  tflite_flutter: ^0.12.1
  image: ^4.9.2
  image_picker: ^1.2.2
  flutter_image_compress: ^2.5.1
  file_picker: ^11.0.3
  mobile_scanner: ^7.4.0

  # --- Notifikasi ---
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1

  # --- Informasi perangkat & aplikasi ---
  device_info_plus: ^11.3.0
  package_info_plus: ^8.3.0

  # --- UI ---
  cupertino_icons: ^1.0.9
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  freezed: ^3.2.5
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/icons/menu/
    - assets/icons/nav/
    - assets/icon/

flutter_gen:
  output: lib/core/assets/
  integrations:
    flutter_svg: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
